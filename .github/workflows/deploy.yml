# main dalına her push'ta oyunu derleyip GitHub Pages'e yayınlar.
# Repo ayarı: Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Kural 5.6: son teslimden (18 Ekim 18.00, UTC+3) sonra değerlendirilen sürüm değişmesin.
      - name: Teslim sonrası yayın kilidi
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-10-18T15:00:00Z' +%s)" ]; then
            echo "Son teslim geçti: canlı oyun teslim edilen sürümde kalsın diye yayın kapalı."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
